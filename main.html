<!DOCTYPE html>
<head>    
    <title>Feeling Sleepy?</title>  
    <style>
        body{
            text-align: center;
            color: white;
            text-decoration: none;
            background-color: #10163f;

            }
        .top {
                background-image: url(sleepy_web_design.jpg);
                height: 75vh;
                background-size: 100% 100%;
                background-position: top;
                background-repeat: no-repeat;
                background-attachment: scroll;

            }
        h1{
            font-size: 400%;
        }
        h2{
            font-size: 200%
        }
        h3{
            font-size: 150%
        }
        h4{
            font-size: 350%
        }
        h5{
            font-size: 300%
        }
        h6{
            font-size: 200%
        }
        #minigameframe {
            display: none;
        }
        .eyemask {
            display: block;
            margin-right: 850px;
        }
        .pillow {
            display: block;
            margin-left: 850px;
        }
        .star {
            display: block;
            margin-left: 850px;
        }
        .moon {
            display: block;
            margin-right: 850px;
        }
        .image_reveal {
            animation: image_reveal both;
            animation-timeline: view(50% 20%);
        }
        @keyframes image_reveal {
            from {
                filter: saturate(0) contrast(4) brightness(0.1) blur(5px);
                opacity: 0;
                scale: .95;
                translate: 0n 4rem;
            }
            to {
                filter: none;
                opacity: 1;
                scale: 1;
                translate: 0 0;
            }
        }
    </style>
        
    
</head>
    
<body>
    <div class = "top">
        <h1> <br> Feeling Sleepy?</h1>
        <h2>Are you feeling tired, but not tired enough to drift into sleep?</h2>
        <h3> <br>Relax for sleep with our game, Sleepy!</h3>
    </div>
    
    
    
    <h1>Welcome to Sleepy</h1>

    <div class = "eyemask">
        <img src="mask.jpg" alt="Eyemask"
        width="150"
        height="150"
        class = "image_reveal"
        >
    </div>

    <h4>Zzzzz</h4>

    <div class = "star">
        <img src="star2.jpg" alt="Star"
        width="150"
        height="150"
        class = "image_reveal"
        >
    </div>

    <h5>Zzzz</h5>

    <div class = "moon">
        <img src="moon2.jpg" alt="Moon"
        width="150"
        height="200"
        class = "image_reveal"
        >
    </div>
    

    <h6>Zzz</h6>

    
    <div class = "pillow">
        <img src="pillowII.jpg" alt="Pillow"
        width="150"
        height="150"
        class = "image_reveal"
        >
    </div>
    <h6>Huh, oh!</h6>

    <p>Oh sorry I fell asleep, and with this 
    relaxing game, you will too...</p>
    <p>Surrender to your dreams with Sleepy</p>

    <h5>Play Now</h5>
    <iframe src="sleepy_website_design_frame.jpg" frameborder="0" height="1920px" width="1080px" title="Game Frame" id="vnframe"></iframe>
    <iframe src="sleepy_website_design_frame.jpg" frameborder="0" height="1920px" width="1080px" title="Game Frame" id="minigameframe"></iframe>
    <script src="main.js" defer></script>

    <div class = "clouds">
        <img src="clouds.jpg" alt="Clouds"
        width="cover"
        height="500"
        >
    </div>
</body>
